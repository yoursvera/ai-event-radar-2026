// State
let favorites = JSON.parse(localStorage.getItem('ai-radar-favs') || '[]');
let currentFilter = 'all';
let showFavOnly = false;

function saveFavorites() {
  localStorage.setItem('ai-radar-favs', JSON.stringify(favorites));
  document.getElementById('fav-count').textContent = favorites.length;
}

function isFav(id) { return favorites.includes(id); }

function toggleFav(id) {
  if (isFav(id)) { favorites = favorites.filter(f => f !== id); }
  else { favorites.push(id); }
  saveFavorites();
  render();
}

function getDaysUntil(dateStr) {
  const today = new Date('2026-05-14');
  const target = new Date(dateStr);
  return Math.ceil((target - today) / (1000*60*60*24));
}

function getTagClass(type) {
  const map = { '行业峰会':'tag-industry', '厂商峰会':'tag-vendor', '厂商发布':'tag-release', '行业展会':'tag-expo', '学术顶会':'tag-academic' };
  return map[type] || 'tag-industry';
}

function showDetail(id) {
  const c = conferences.find(x => x.id === id);
  if (!c) return;
  const days = getDaysUntil(c.dateObj);
  document.getElementById('detail-content').innerHTML = `
    <h2>${c.name}</h2>
    <div class="detail-section"><h3>基本信息</h3>
      <p><strong>日期：</strong>${c.date === '-' ? '未官宣' : c.date + '，' + c.year} &nbsp; ${c.status==='confirmed'?'<span class="status-ok">✓ 官方确认</span>':'<span class="status-warn">⚠ 未官宣</span>'}</p>
      <p><strong>地点：</strong>${c.location}</p>
      <p><strong>主办方：</strong>${c.org}</p>
      <p><strong>官网：</strong><a href="${c.url}" target="_blank">${c.url}</a></p>
      ${days > 0 ? '<p><strong>倒计时：</strong><span style="color:#6366f1;font-weight:600;">'+days+' 天后</span></p>' : ''}
    </div>
    <div class="detail-section"><h3>战略分析师关注要点</h3><p>${c.detail}</p></div>
    <div class="detail-section"><h3>核心议题标签</h3>
      <div class="detail-tags">${c.topics.map(t=>'<span>'+t+'</span>').join('')}</div>
    </div>
  `;
  document.getElementById('detail-overlay').classList.add('show');
}

function closeDetail() { document.getElementById('detail-overlay').classList.remove('show'); }

function render() {
  const container = document.getElementById('card-container');
  // Group by month
  const months = [...new Set(conferences.map(c => c.month))];
  const monthNames = {'5':'五月 May','6':'六月 June','7':'七月 July','9':'九月 September','10':'十月 October','11':'十一月 November','12':'十二月 December','1-2027':'2027 · 一月 January'};

  let html = '';
  months.forEach(m => {
    let cards = conferences.filter(c => c.month === m);
    // Apply filters
    let visibleCards = cards.filter(c => {
      if (showFavOnly && !isFav(c.id)) return false;
      if (currentFilter !== 'all' && c.type !== currentFilter) return false;
      return true;
    });
    if (visibleCards.length === 0) return;

    html += `<section class="month-section" id="month-${m}">`;
    html += `<div class="month-header"><span class="month-num">${m.replace('-2027','')}</span><div><div class="month-name">${monthNames[m]||m}</div><span class="month-count">${visibleCards.length}场</span></div></div>`;

    visibleCards.forEach(c => {
      const days = getDaysUntil(c.dateObj);
      const favClass = isFav(c.id) ? 'favorited' : '';
      const favIcon = isFav(c.id) ? '★' : '☆';
      const countdown = days > 0 ? `<span class="countdown-inline">${days}天后</span>` : '';

      html += `<div class="card" data-type="${c.type}" data-id="${c.id}">
        <div class="card-row1">
          <span class="card-title">${c.name}</span>
          <span class="tag ${getTagClass(c.type)}">${c.type}</span>
          ${countdown}
        </div>
        <div class="card-meta">
          <span>${c.date === '-' ? '📅 未官宣' : '📅 '+c.date}</span>
          <span>📍 ${c.location}</span>
          <span class="${c.status==='confirmed'?'status-ok':'status-warn'}">${c.status==='confirmed'?'✓ 确认':'⚠ 未确认'}</span>
        </div>
        <div class="card-desc">${c.desc}</div>
        <div class="card-footer">
          <span class="card-org">${c.org}</span>
          <div class="card-actions">
            <a class="btn-detail" onclick="showDetail('${c.id}')">查看详情 →</a>
            <a href="${c.url}" target="_blank" class="btn-detail" style="margin-left:4px;">官网 ↗</a>
            <button class="btn-fav ${favClass}" onclick="event.stopPropagation();toggleFav('${c.id}')" title="${isFav(c.id)?'取消关注':'加入关注'}">${favIcon}</button>
          </div>
        </div>
      </div>`;
    });
    html += '</section>';
  });

  if (!html) html = '<div style="text-align:center;padding:60px;color:#64748b;">没有符合筛选条件的大会</div>';
  container.innerHTML = html;
}

// Events
document.getElementById('detail-close').onclick = closeDetail;
document.getElementById('detail-overlay').onclick = function(e) { if(e.target===this) closeDetail(); };
document.addEventListener('keydown', function(e) { if(e.key==='Escape') closeDetail(); });

document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentFilter = this.dataset.filter;
    showFavOnly = false;
    document.getElementById('fav-filter').classList.remove('fav-active');
    render();
  });
});

document.getElementById('fav-filter').addEventListener('click', function() {
  showFavOnly = !showFavOnly;
  this.classList.toggle('fav-active', showFavOnly);
  if (showFavOnly) {
    document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
    document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');
    currentFilter = 'all';
  }
  render();
});

// Nav scroll highlight
window.addEventListener('scroll', () => {
  const sections = document.querySelectorAll('.month-section');
  let current = '';
  sections.forEach(s => { if (window.scrollY >= s.offsetTop - 80) current = s.id; });
  document.querySelectorAll('.nav-bar a').forEach(a => {
    a.classList.toggle('active', a.getAttribute('href') === '#' + current);
  });
});

// Init
saveFavorites();
render();
</script>
</body>
</html>
